
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin_console129319</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0d0d0d;
            color: #c4c4c4;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .terminal {
            width: 100%;
            max-width: 500px;
            background: #151515;
            border: 1px solid #444;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            color: #e0e0e0;
            font-size: 25px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 19px;
            font-weight: normal;
        }

        p {
            font-size: 14px;
            line-height: 1.7;
        }

        input {
            background: #0d0d0d;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button, .secret-link {
            background: #252525;
            color: #e0e0e0;
            border: 1px solid #666;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .secret-link:hover {
            background: #383838;
        }

        #message {
            color: #b86b6b;
        }

        #secret {
            display: none;
        }
    </style>
</head>

<body>

    <main class="terminal">

        <h1>ADMIN CONSOLE</h1>

        <div id="login">
            <p>Zugangscode erforderlich.</p>

            <form id="loginForm">
                <input
                    type="password"
                    id="password"
                    placeholder="Passwort..."
                    autocomplete="off"
                    required
                >

                <button type="submit">ENTSPERREN</button>
            </form>

            <p id="message"></p>
        </div>

        <div id="secret">
            <h2>Zugriff gewährt.</h2>

            <p>DATEI: unknown.txt</p>

            <a
                class="secret-link"
                href="https://vaulted-pullover-957.notion.site/MESSAGE-29-Danke-3fd57644b71f80459400fdb72bc8ec3f?source=copy_link"
                target="_blank"
                rel="noopener noreferrer"
            >
                DATEI ÖFFNEN
            </a>
        </div>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            checkPassword();
        });

        function checkPassword() {
            const password = document.getElementById("password").value;

            if (password === "ELYAS") {
                document.getElementById("login").style.display = "none";
                document.getElementById("secret").style.display = "block";
            } else {
                document.getElementById("message").innerText =
                    "Falsches Passwort.";

                document.getElementById("password").value = "";
            }
        }
    </script>

</body>
</html>
